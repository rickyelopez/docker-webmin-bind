name: Docker Build Dev
on:
  pull_request:
    paths:
      - '.github/workflows/*'
      - 'Dockerfile'
      - 'entrypoint.sh'
jobs:
  build:
    name: Build Multiarch Images
    runs-on: ubuntu-latest
    environment: env
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Dockerhub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: GitHub container registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup image tags
        id: docker-metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            rickyelopez/webmin-bind
            ghcr.io/rickyelopez/webmin-bind
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          cache-from: type=registry,ref=rickyelopez/webmin-bind:dev-buildcache
          cache-to: type=registry,ref=rickyelopez/webmin-bind:dev-buildcache,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/rickyelopez/webmin-bind
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
